<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A basic Python Flask web application.">
    <title>{{ app_name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">PYTHON + FLASK</p>
      <h1>{{ app_name }}</h1>
      <p class="intro">
        Your Python web application is running successfully.
      </p>

      <section class="details" aria-label="Application details">
        <div>
          <span>Status</span>
          <strong class="status"><i aria-hidden="true"></i> Healthy</strong>
        </div>
        <div>
          <span>Environment</span>
          <strong>{{ environment }}</strong>
        </div>
        <div>
          <span>Server hostname</span>
          <strong>{{ hostname }}</strong>
        </div>
        <div>
          <span>Server time</span>
          <strong>{{ current_time }}</strong>
        </div>
      </section>

      <p class="hint">
        Health check: <a href="/health"><code>/health</code></a>
      </p>
    </main>
  </body>
</html>
